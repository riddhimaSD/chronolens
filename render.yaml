# Render Blueprint — deploys the ChronoLens demo as one web service (API + front end + imagery).
services:
  - type: web
    name: chronolens
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/system
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
